name: meet-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetai
      POSTGRES_PASSWORD: meetai
      POSTGRES_DB: meetai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetai -d meetai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
