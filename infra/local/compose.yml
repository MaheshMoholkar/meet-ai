name: meet-ai

# Local infrastructure only; the Next app, summarizer worker, voice agent and
# speech models run natively. Start it with `make up` from the repository root,
# which passes the root .env (LiveKit keys) and the LAN address LiveKit advertises.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetai
      POSTGRES_PASSWORD: meetai
      POSTGRES_DB: meetai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetai -d meetai"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    image: livekit/livekit-server:latest
    environment:
      # node_ip must be reachable from the browser on the host AND from the
      # Egress container; the Makefile sets it to the Mac's LAN address.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://host.docker.internal:3000/api/webhooks/livekit
        room:
          empty_timeout: 60
          departure_timeout: 20
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 8080
        log_level: info
    # Room-composite recording renders in headless Chrome.
    cap_add:
      - SYS_ADMIN
    shm_size: 1g
    depends_on:
      - livekit

  # AWS emulator for S3 and SQS. State is in memory: it resets on restart.
  moto:
    image: motoserver/moto:latest
    ports:
      - "4566:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
