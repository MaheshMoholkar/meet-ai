name: Deploy

# Manual until AWS is set up (infra/README.md). Then add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → the deploy role; no stored AWS keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Repository variables, from `tofu output deploy`:
#   AWS_REGION, AWS_DEPLOY_ROLE, ECS_CLUSTER, ECR_REGISTRY, ECR_PREFIX, APP_URL,
#   MIGRATE_TASK_DEF, TASK_SUBNETS, TASK_SECURITY_GRP
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # the images and Fargate tasks are arm64 (Graviton)
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/web:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/worker:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/agent:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/agent:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Run database migrations
        run: |
          task_arn=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.MIGRATE_TASK_DEF }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.TASK_SUBNETS }}],securityGroups=[${{ vars.TASK_SECURITY_GRP }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migrations failed (exit code $exit_code); see the /meet-ai/migrate log group"
            exit 1
          fi

      - name: Roll out the services
        run: |
          for service in web worker agent; do
            aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "$service" \
              --force-new-deployment --query 'service.serviceName' --output text
          done
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services web worker agent
